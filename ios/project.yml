# XcodeGen spec — generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: BanFromEntering
options:
  bundleIdPrefix: com.banfromentering
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set your Apple team ID here or in Xcode → Signing & Capabilities

targets:
  BanFromEntering:
    type: application
    platform: iOS
    sources:
      - BanFromEntering
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banfromentering.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: BanFromEntering/Info.plist
      properties:
        CFBundleDisplayName: Ban From Entering
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: >-
          Your location is compared with the places you are banned from entering so you can be warned before you get too close.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Allow "Always" so you are warned about banned places even when the app is closed. Your location never leaves this device.

  BanFromEnteringTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BanFromEnteringTests
    dependencies:
      - target: BanFromEntering

schemes:
  BanFromEntering:
    build:
      targets:
        BanFromEntering: all
    test:
      targets:
        - BanFromEnteringTests
